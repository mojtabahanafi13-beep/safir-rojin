۳. در تب Actions روی Build Rojin Dashboard V6 کلیک کنید و پس از سبز شدن (✅)، فایل Rojin-Dashboard-APK را دانلود و روی گوشی نصب کنید.

در برنامه سفیر برای هر اتفاق 2تا اعلان میاد .برنامه داشبورد هیچ اعلانی نمیاد

عکسی که فرستادید دقیقاً علت هر دو مورد را مشخص کرد:

    چرا در «سفیر روژین» ۲ اعلان می‌آمد؟ اعلان اول (ماموریت جدید در سفیر روژین 🚀) توسط سرویس پس‌زمینه اندروید ساخته می‌شد و هم‌زمان اعلان دوم (🚚 سفیر روژین | 🚚 پرتال راننده...) از داخل صفحه وب (WebView) ارسال می‌شد.

    چرا در «داشبورد روژین» اعلانی نمی‌آمد؟ در نسخه V6 که برای باز شدن PDFها ساخته شد، سرویس پس‌زمینه اعلان‌ها (DashboardSyncService) اضافه نشده بود.

در نسخه جدید (Build Rojin Apps V7)، هر دو برنامه را در یک دستور واحد قرار دادم تا با یک بار اجرا، هر دو فایل نصبی اصلاح‌شده را تحویل بگیرید:

    در «سفیر روژین» (Safir-Rojin-APK): فیلتر ضدتکرار (SafirDedup) اضافه شد تا اعلان دوم و تکراریِ صفحه وب حذف شود و برای هر ماموریت یا پیام فقط ۱ اعلان تمیز بیاید.

    در «داشبورد روژین» (Rojin-Dashboard-APK): سرویس پس‌زمینه دائمی (DashboardSyncService) اضافه شد که هم به کانال لحظه‌ای سرور (/api/dashboard-events) وصل است و هم پیام‌های جدید رانندگان و تغییر وضعیت سفرها (شروع مسیر، تحویل موفق/ناموفق، پایان مسیر، رسید و فاکتور جدید) را حتی در حالت بسته بودن برنامه یا قفل بودن صفحه گوشی، با ۱ اعلان صدا‌دار نمایش می‌دهد (و نمایشگر داخلی PDF رسیدها و فاکتورها هم سر جای خودش فعال است).

