۲ گام بسیار ساده برای ساخت نسخه اندروید «داشبورد روژین» (پنل مدیریت)

گام اول: حذف فایل ناقص قبلی (dashboard.yml)
۱. در گیت‌هاب وارد پوشه .github/workflows شوید.
۲. روی فایل dashboard.yml (و اگر فایل دیگری به نام dashboard-android.yml هم از قبل آپلود کرده‌اید روی آن هم) بزنید.
۳. بالای صفحه سمت راست، روی سه نقطه (...) بزنید، گزینه Delete file (حذف فایل) را انتخاب کنید و دکمه سبز Commit changes را بزنید تا فایل ناقص قبلی کامل پاک شود.

گام دوم: قرار دادن فایل سالم و جدید (rojin-dashboard.yml)

    روش اول (آپلود مستقیم بدون کپی/پیست): فایل rojin-dashboard.yml بالا را روی گوشی دانلود کنید، در پوشه .github/workflows روی دکمه + بالای صفحه بزنید، گزینه Upload files را انتخاب کنید، همین فایل rojin-dashboard.yml را انتخاب کرده و Commit changes را بزنید.

    روش دوم (اگر با + Create new file می‌سازید): نام فایل را rojin-dashboard.yml بگذارید و این کد کوتاه ۳۸ خطی را داخل آن پیست کرده و Commit changes را بزنید:

YAML

name: Build Rojin Dashboard V2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Convert Project to Rojin Dashboard
        run: python3 -c "import pathlib; [p.write_text(p.read_text('utf-8', errors='ignore').replace('ir.factoranbar.safirrojin','ir.factoranbar.dashboard').replace('/driver/index.html','/dashboard/dashboard.html').replace('سفیر روژین','داشبورد روژین').replace('Safir Rojin','Rojin Dashboard').replace('/api/driver/position','/api/dashboard-fleet/unread').replace('/api/driver/track','/api/dashboard-fleet/unread'), 'utf-8') for p in pathlib.Path('app').rglob('*') if p.is_file() and p.suffix in ('.gradle','.kts','.java','.kt','.xml','.html','.js')]"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rojin-Dashboard.apk

      - name: Upload Rojin-Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Rojin-Dashboard-APK
          path: Rojin-Dashboard.apk

بعد از زدن دکمه سبز، وارد تب Actions شوید؛ این بار گزینه‌ای با نام Build Rojin Dashboard V2 خواهید دید که بعد از حدود ۱ دقیقه تیک سبز (✅) می‌خورد و فایل Rojin-Dashboard-APK را به شما تحویل می‌دهد.

برنامه نصب شد.اما رسیدها و فاکتورها باز نمیشن

علت باز نشدن رسیدها و فاکتورها این است که در پنل داشبورد روژین، تمام دکمه‌های «مشاهدهٔ رسید»، «مشاهدهٔ فاکتور» و «پوشهٔ ماه» فایل‌های PDF را در تب جدید (target="_blank") باز می‌کنند، اما نمایشگر پیش‌فرض اندروید (WebView) به صورت خام قابلیت نمایش مستقیم فایل PDF را ندارد.

در نسخه جدید (Build Rojin Dashboard V3)، یک نمایشگر داخلی PDF، رسید، پوشه ماه و تصاویر ناوگان مستقیماً به داخل برنامه اندروید اضافه کردم که:

    با زدن روی «مشاهدهٔ رسید» یا «مشاهدهٔ فاکتور»، فایل PDF را همان لحظه داخل خود برنامه با قابلیت بزرگ‌نمایی (➕ / ➖) باز می‌کند.

    با زدن روی «پوشهٔ ماه»، لیست پوشه‌ها و فایل‌ها را داخل برنامه نمایش می‌دهد و با زدن روی هر فایل، همان‌جا بازش می‌کند.

    دکمه «↗ اشتراک / PDF خوان» بالای صفحه دارد تا هر زمان خواستید فاکتور یا رسید را در واتساپ/تلگرام بفرستید یا با PDFخوان گوشی باز کنید.

