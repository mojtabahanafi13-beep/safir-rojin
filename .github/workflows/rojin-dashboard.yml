گام‌های بروزرسانی هر دو برنامه با یک کلیک

۱. در پروژه safir-rojin، فایل .github/workflows/rojin-dashboard.yml را در حالت ویرایش (✏️ Edit) باز کنید.
۲. کل متن قبلی را با Ctrl + A پاک کنید، کد زیر را جایگزین کنید (یا فایل rojin-dashboard.yml بالا را آپلود کنید) و Commit changes را بزنید:
