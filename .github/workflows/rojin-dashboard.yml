۳. در تب Actions روی Build Rojin Apps V7 کلیک کنید؛ در پایین آن صفحه هر دو فایل Safir-Rojin-APK و Rojin-Dashboard-APK را خواهید دید که می‌توانید دانلود و روی نسخه قبلی نصب کنید.

در برنامه داشبورد نوتیقیکیشن فقط داخل برنامه بودنی میاد و اینکه دکمه ویس کار نمیکنه دوربین هم باز نمیشه تو چت

نسخهٔ جدید V8 (Build Rojin Apps V8) آماده شد و هر ۳ مورد در برنامهٔ داشبورد روژین به‌طور کامل برطرف شدند:
نماد YML
rojin-dashboard
 YML 
چه تغییراتی در نسخهٔ V8 انجام شد؟

    دریافت اعلان در خارج از برنامه و حالت قفل صفحه: سرویس پس‌زمینه (DashboardSyncService) اکنون در تمام فراخوانی‌ها (onCreate و onStartCommand) با نوع dataSync، قفل بیداری پردازنده (WakeLock) و قفل وای‌فای (WifiLock) فعال می‌ماند تا اندروید پس از ۵ ثانیه خروج از برنامه آن را نبندد؛ همچنین تا زمانی که از برنامه خارج هستید، پیام‌های دریافتی به‌صورت خودکار «خوانده‌شده» علامت نمی‌خورند و هر ۷ ثانیه پیام‌های متنی، صوتی، تصویری و وضعیت‌های سفر بررسی و با صدا و ویبره اعلان می‌شوند.

    کارکردن دکمهٔ ضبط ویس (🎙 ضبط ویس) در گفت‌وگو: ضبط صدا به موتور بومی اندروید (MediaRecorder با فرمت استاندارد audio/mp4) متصل شد؛ کافی است یک بار روی 🎙 ضبط ویس بزنید تا ضبط شروع شود (یا دکمه را نگه دارید) و دوباره روی ⏹ پایان و ارسال ویس بزنید تا ویس بلافاصله برای راننده ارسال شود.

    باز شدن مستقیم دوربین (📷 دوربین) در گفت‌وگو: دکمهٔ 📷 دوربین اکنون مستقیماً دوربین اصلی گوشی (ACTION_IMAGE_CAPTURE) را باز می‌کند و پس از گرفتن عکس و زدن تیک تایید، تصویر را فشرده‌سازی و در لحظه داخل چت برای راننده ارسال می‌کند.

مراحل جایگزینی و دریافت فایل نصبی جدید

    در گیت‌هاب وارد مخزن safir-rojin شوید و فایل .github/workflows/rojin-dashboard.yml را باز کنید.

    روی آیکون مداد (Edit) بزنید، کل متن قبلی را پاک کنید و محتوای فایل rojin-dashboard.yml بالا را جایگزین کرده و Commit changes را بزنید.

    از تب Actions وارد اجرای Build Rojin Apps V8 شوید و پس از سبز شدن، از بخش Artifacts در پایین صفحه، فایل Rojin-Dashboard-APK را دانلود و روی گوشی نصب کنید (هنگام اولین استفاده از ویس یا دوربین در چت، دسترسی میکروفون و دوربین را Allow / مجاز بزنید).


