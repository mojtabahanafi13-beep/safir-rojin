name: Build Rojin Apps V7

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Duplicate Notifications in Safir Rojin
        run: python3 -c "import pathlib, re; dedup_tpl = 'package __PKG__;\n\nimport android.app.Notification;\n\npublic class SafirDedup {\n    private static long lastAlertMs = 0L;\n    private static String lastKey = \x22\x22;\n\n    public static synchronized boolean allow(int id, Notification n) {\n        if (n == null) return false;\n        if ((n.flags & Notification.FLAG_ONGOING_EVENT) != 0) return true;\n        if (id == 1 || id == 101 || id == 201) return true;\n        String title = \x22\x22;\n        String text = \x22\x22;\n        try {\n            if (n.extras != null) {\n                CharSequence t = n.extras.getCharSequence(Notification.EXTRA_TITLE);\n                CharSequence b = n.extras.getCharSequence(Notification.EXTRA_TEXT);\n                if (t != null) title = t.toString();\n                if (b != null) text = b.toString();\n            }\n        } catch (Exception ignored) {}\n        if (title.contains(\x22پرتال راننده\x22)) return false;\n        long now = System.currentTimeMillis();\n        String key = title + \x22|\x22 + text;\n        if (now - lastAlertMs < 15000L || (key.equals(lastKey) && now - lastAlertMs < 60000L)) {\n            return false;\n        }\n        lastAlertMs = now;\n        lastKey = key;\n        return true;\n    }\n}\n'; jfiles = list(pathlib.Path('app/src/main/java').rglob('*.java')); pkg = 'ir.factoranbar.safirrojin'; m = re.search(r'package\s+([a-zA-Z0-9_.]+)\s*;', jfiles[0].read_text('utf-8', errors='ignore')) if jfiles else None; pkg = m.group(1) if m else pkg; (jfiles[0].parent / 'SafirDedup.java').write_text(dedup_tpl.replace('__PKG__', pkg), 'utf-8') if jfiles else None; [p.write_text(re.sub(r'(\b\w+)\.notify\(([^,]+),\s*([^;]+)\)\s*;', r'{ android.app.Notification _n = \3; if (SafirDedup.allow(\2, _n)) \1.notify(\2, _n); }', p.read_text('utf-8', errors='ignore')).replace('window.SafirRojinAndroid.showNativeNotification', 'void').replace('CookieManager.getInstance().flush();', 'CookieManager.getInstance().flush(); view.evaluateJavascript(\x22window.sendDriverLocalSystemNotification=function(){};\x22, null);'), 'utf-8') for p in jfiles if p.name != 'SafirDedup.java']"

