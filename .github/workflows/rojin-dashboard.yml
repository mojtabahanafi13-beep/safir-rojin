NTED) needed.add(p);\n            }\n            if (Build.VERSION.SDK_INT >= 33) {\n                if (checkSelfPermission(\x22android.permission.POST_NOTIFICATIONS\x22) != PackageManager.PERMISSION_GRANTED) {\n                    needed.add(\x22android.permission.POST_NOTIFICATIONS\x22);\n                }\n            }\n            if (!needed.isEmpty()) requestPermissions(needed.toArray(new String[0]), 1002);\n        }\n    }\n\n    @Override\n    protected void onActivityResult(int reqCode, int resCode, Intent data) {\n        super.onActivityResult(reqCode, resCode, data);\n        if (reqCode == 1001 && filePathCallback != null) {\n            filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resCode, data));\n            filePathCallback = null;\n        }\n    }\n\n    @Override\n    public void onBackPressed() {\n        if (webView != null && webView.canGoBack()) {\n            webView.goBack();\n        } else {\n            moveTaskToBack(true);\n        }\n    }\n}\n')"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rojin-Dashboard.apk

      - name: Upload Rojin-Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Rojin-Dashboard-APK
          path: Rojin-Dashboard.apk
