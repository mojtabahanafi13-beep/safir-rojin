      - name: Write DashboardSyncService Part 4
        run: python3 -c "import pathlib; p = pathlib.Path('app/src/main/java/ir/factoranbar/dashboard/DashboardSyncService.java'); p.parent.mkdir(parents=True, exist_ok=True); open(p, 'a', encoding='utf-8').write('\n                    String evName = \x22\x22;\n                    while (running && (line = br.readLine()) != null) {\n                        if (line.startsWith(\x22event\x3a\x22)) {\n                            evName = line.substring(6).trim();\n                        } else if (line.startsWith(\x22data\x3a\x22)) {\n                            String dataStr = line.substring(5).trim();\n                            if (\x22notification\x22.equals(evName) && !dataStr.isEmpty()) {\n                                try {\n                                    JSONObject d = new JSONObject(dataStr);\n                                    String t = d.optString(\x22title\x22, \x22اعلان جدید داشبورد\x22);\n                                    String b = d.optString(\x22body\x22, \x22\x22);\n                                    String tag = d.optString(\x22tag\x22, \x22sse-\x22 + d.optLong(\x22ts\x22, System.currentTimeMillis()));\n                                    showAlertNotification(DashboardSyncService.this, t, b, tag);\n                                } catch (Exception ignored) {}\n                            }\n                        }\n                    }\n                    br.close();\n                }\n            } catch (Exception ignored) {\n            } finally {\n                if (conn != null) {\n                    try { conn.disconnect(); } catch (Exception ignored) {}\n                }\n                sseActive = false;\n            }\n        });\n    }\n\n    private String httpGet(String urlStr, String token) throws Exception {\n        URL u = new URL(urlStr);\n        HttpURLConnection c = (HttpURLConnection) u.openConnection();\n        c.setRequestMethod(\x22GET\x22);\n        c.setConnectTimeout(8000);\n        c.setReadTimeout(8000);\n        c.setUseCaches(false);\n        c.setRequestProperty(\x22Authorization\x22, \x22Bearer \x22 + token);\n        try {\n            if (c.getResponseCode() != 200) return null;\n            BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));\n            StringBuilder sb = new StringBuilder();\n            String ln;\n            while ((ln = br.readLine()) != null) sb.append(ln);\n            br.close();\n            return sb.toString();\n        } finally {\n            try { c.disconnect(); } catch (Exception ignored) {}\n        }\n    }\n\n    private void pollServerState() {\n        SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);\n        String token = prefs.getString(\x22token\x22, \x22\x22);\n        if (token.isEmpty()) return;\n\n        // 1. Check unread driver messages per trip and fetch exact message details\n        try {\n            String unreadResp = httpGet(\x22https\x3a//server.factor-anbar.online/api/dashboard-fleet/unread\x22, token);\n            if (unreadResp != null) {\n                JSONObject j = new JSONObject(unreadResp);\n                JSONObject map = j.optJSONObject(\x22unreadByTrip\x22);\n                if (map != null) {\n                    String notifiedIds = prefs.getString(\x22notifiedDashMsgIds\x22, \x22\x22);\n                    StringBuilder updatedIds = new StringBuilder(notifiedIds);\n                    boolean changedIds = false;\n\n                    Iterator<String> it = map.keys();\n                    while (it.hasNext()) {\n                        String tripId = it.next();\n                        int cnt = map.optInt(tripId, 0);\n                        if (cnt > 0 && !tripId.isEmpty()) {\n                            Str')"

