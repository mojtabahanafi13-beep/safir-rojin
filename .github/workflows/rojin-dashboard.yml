گام‌های بروزرسانی (کمتر از ۱ دقیقه)

۱. در گیت‌هاب وارد پوشه .github/workflows شوید و روی فایل rojin-dashboard.yml بزنید.
۲. روی آیکون مداد (✏️ Edit) بزنید، متن قبلی را پاک کنید و کد زیر را جایگزین کنید (یا فایل rojin-dashboard.yml بالا را مستقیم آپلود کنید) و دکمه سبز Commit changes را بزنید:
YAML

name: Build Rojin Dashboard V3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Viewer Part 1
        run: printf '%s' '' > /tmp/dash_v3.b64

      - name: Prepare Viewer Part 2
        run: printf '%s' '' >> /tmp/dash_v3.b64

      - name: Prepare Viewer Part 3
        run: printf '%s' '' >> /tmp/dash_v3.b64

      - name: Prepare Viewer Part 4
        run: printf '%s' '' >> /tmp/dash_v3.b64

      - name: Prepare Viewer Part 5
        run: printf '%s' '' >> /tmp/dash_v3.b64

      - name: Prepare Viewer Part 6
        run: printf '%s' 'eQxVgv23SQC2wfjb/PjNggC6DNPx8NybIO80cHUyq3GRKjmOagy++r2MCNIYsPGtFPQljtGpHWBNxnHHKTgqrfJlEO3rc9oeuGpIO9qbUcRfKmlo90RM0sT0HwLW/wELZ7UF' >> /tmp/dash_v3.b64

      - name: Convert Project to Rojin Dashboard V3
        run: python3 -c "import zlib,base64,pathlib; exec(zlib.decompress(base64.b64decode(pathlib.Path('/tmp/dash_v3.b64').read_text())).decode('utf-8'))"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rojin-Dashboard.apk

      - name: Upload Rojin-Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Rojin-Dashboard-APK
          path: Rojin-Dashboard.apk

۳. در تب Actions روی Build Rojin Dashboard V3 بزنید، فایل Rojin-Dashboard-APK را دانلود کرده و مستقیم روی نسخه قبلی نصب کنید (نیازی به حذف نسخه قبلی نیست).

