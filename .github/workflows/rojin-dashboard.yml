name: Build Rojin Apps V8

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Duplicate Notifications in Safir Rojin
        run: python3 -c "import pathlib, re; dedup_tpl = 'package __PKG__;\n\nimport android.app.Notification;\n\npublic class SafirDedup {\n    private static long lastAlertMs = 0L;\n    private static String lastKey = \x22\x22;\n\n    public static synchronized boolean allow(int id, Notification n) {\n        if (n == null) return false;\n        if ((n.flags & Notification.FLAG_ONGOING_EVENT) != 0) return true;\n        if (id == 1 || id == 101 || id == 201) return true;\n        String title = \x22\x22;\n        String text = \x22\x22;\n        try {\n            if (n.extras != null) {\n                CharSequence t = n.extras.getCharSequence(Notification.EXTRA_TITLE);\n                CharSequence b = n.extras.getCharSequence(Notification.EXTRA_TEXT);\n                if (t != null) title = t.toString();\n                if (b != null) text = b.toString();\n            }\n        } catch (Exception ignored) {}\n        if (title.contains(\x22پرتال راننده\x22)) return false;\n        long now = System.currentTimeMillis();\n        String key = title + \x22|\x22 + text;\n        if (now - lastAlertMs < 15000L || (key.equals(lastKey) && now - lastAlertMs < 60000L)) {\n            return false;\n        }\n        lastAlertMs = now;\n        lastKey = key;\n        return true;\n    }\n}\n'; jfiles = list(pathlib.Path('app/src/main/java').rglob('*.java')); pkg = 'ir.factoranbar.safirrojin'; m = re.search(r'package\s+([a-zA-Z0-9_.]+)\s*;', jfiles[0].read_text('utf-8', errors='ignore')) if jfiles else None; pkg = m.group(1) if m else pkg; (jfiles[0].parent / 'SafirDedup.java').write_text(dedup_tpl.replace('__PKG__', pkg), 'utf-8') if jfiles else None; [p.write_text(re.sub(r'(\b\w+)\.notify\(([^,]+),\s*([^;]+)\)\s*;', r'{ android.app.Notification _n = \3; if (SafirDedup.allow(\2, _n)) \1.notify(\2, _n); }', p.read_text('utf-8', errors='ignore')).replace('window.SafirRojinAndroid.showNativeNotification', 'void').replace('CookieManager.getInstance().flush();', 'CookieManager.getInstance().flush(); view.evaluateJavascript(\x22window.sendDriverLocalSystemNotification=function(){};try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});}catch(e){}\x22, null);'), 'utf-8') for p in jfiles if p.name != 'SafirDedup.java']"

      - name: Build Safir Rojin APK
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Upload Safir-Rojin APK
        uses: actions/upload-artifact@v4
        with:
          name: Safir-Rojin-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Clean Dashboard Structure
        run: python3 -c "import pathlib, shutil; shutil.rmtree('app/src/main/java', ignore_errors=True); [p.write_text(p.read_text('utf-8', errors='ignore').replace('ir.factoranbar.safirrojin','ir.factoranbar.dashboard').replace('سفیر روژین','داشبورد روژین').replace('Safir Rojin','Rojin Dashboard'), 'utf-8') for p in pathlib.Path('app').rglob('*') if p.is_file() and p.suffix in ('.gradle','.kts','.xml')]; pathlib.Path('app/src/main/AndroidManifest.xml').write_text('<?xml version=\x221.0\x22 encoding=\x22utf-8\x22?>\n<manifest xmlns\x3aandroid=\x22http\x3a//schemas.android.com/apk/res/android\x22>\n\n    <uses-permission android\x3aname=\x22android.permission.INTERNET\x22 />\n    <uses-permission android\x3aname=\x22android.permission.ACCESS_NETWORK_STATE\x22 />\n    <uses-permission android\x3aname=\x22android.permission.ACCESS_WIFI_STATE\x22 />\n    <uses-permission android\x3aname=\x22android.permission.CHANGE_WIFI_STATE\x22 />\n    <uses-permission android\x3aname=\x22android.permission.ACCESS_FINE_LOCATION\x22 />\n    <uses-permission android\x3aname=\x22android.permission.ACCESS_COARSE_LOCATION\x22 />\n    <uses-permission android\x3aname=\x22android.permission.CAMERA\x22 />\n    <uses-permission android\x3aname=\x22android.permission.RECORD_AUDIO\x22 />\n    <uses-permission android\x3aname=\x22android.permission.MODIFY_AUDIO_SETTINGS\x22 />\n    <uses-permission android\x3aname=\x22android.permission.POST_NOTIFICATIONS\x22 />\n    <uses-permission android\x3aname=\x22android.permission.FOREGROUND_SERVICE\x22 />\n    <uses-permission android\x3aname=\x22android.permission.FOREGROUND_SERVICE_DATA_SYNC\x22 />\n    <uses-permission android\x3aname=\x22android.permission.FOREGROUND_SERVICE_LOCATION\x22 />\n    <uses-permission android\x3aname=\x22android.permission.WAKE_LOCK\x22 />\n    <uses-permission android\x3aname=\x22android.permission.VIBRATE\x22 />\n    <uses-permission android\x3aname=\x22android.permission.RECEIVE_BOOT_COMPLETED\x22 />\n    <uses-permission android\x3aname=\x22android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\x22 />\n\n    <application\n        android\x3aallowBackup=\x22true\x22\n        android\x3alabel=\x22داشبورد روژین\x22\n        android\x3aicon=\x22@mipmap/ic_launcher\x22\n        android\x3ausesCleartextTraffic=\x22true\x22\n        android\x3atheme=\x22@android\x3astyle/Theme.DeviceDefault.NoActionBar\x22>\n\n        <activity\n            android\x3aname=\x22.MainActivity\x22\n            android\x3aexported=\x22true\x22\n            android\x3alaunchMode=\x22singleTask\x22\n            android\x3aconfigChanges=\x22orientation|screenSize|keyboardHidden\x22>\n            <intent-filter>\n                <action android\x3aname=\x22android.intent.action.MAIN\x22 />\n                <category android\x3aname=\x22android.intent.category.LAUNCHER\x22 />\n            </intent-filter>\n        </activity>\n\n        <service\n            android\x3aname=\x22.DashboardSyncService\x22\n            android\x3aenabled=\x22true\x22\n            android\x3aexported=\x22false\x22\n            android\x3astopWithTask=\x22false\x22\n            android\x3aforegroundServiceType=\x22dataSync\x22 />\n\n        <receiver\n            android\x3aname=\x22.DashBootReceiver\x22\n            android\x3aenabled=\x22true\x22\n            android\x3aexported=\x22true\x22>\n            <intent-filter>\n                <action android\x3aname=\x22android.intent.action.BOOT_COMPLETED\x22 />\n                <action android\x3aname=\x22android.intent.action.MY_PACKAGE_REPLACED\x22 />\n            </intent-filter>\n        </receiver>\n    </application>\n</manifest>\n', 'utf-8')"

      - name: Write DashBootReceiver
        run: python3 -c "import pathlib; p = pathlib.Path('app/src/main/java/ir/factoranbar/dashboard/DashBootReceiver.java'); p.parent.mkdir(parents=True, exist_ok=True); open(p, 'w', encoding='utf-8').write('package ir.factoranbar.dashboard;\n\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.os.Build;\n\npublic class DashBootReceiver extends BroadcastReceiver {\n    @Override\n    public void onReceive(Context context, Intent intent) {\n        if (intent != null && (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())\n                || Intent.ACTION_MY_PACKAGE_REPLACED.equals(intent.getAction()))) {\n            try {\n                Intent si = new Intent(context, DashboardSyncService.class);\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                    context.startForegroundService(si);\n                } else {\n                    context.startService(si);\n                }\n            } catch (Exception ignored) {}\n        }\n    }\n}\n')"

      - name: Write DashboardSyncService Part 1
        run: python3 -c "import pathlib; p = pathlib.Path('app/src/main/java/ir/factoranbar/dashboard/DashboardSyncService.java'); p.parent.mkdir(parents=True, exist_ok=True); open(p, 'w', encoding='utf-8').write('package ir.factoranbar.dashboard;\n\nimport android.app.Notification;\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.app.PendingIntent;\nimport android.app.Service;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.content.pm.ServiceInfo;\nimport android.graphics.BitmapFactory;\nimport android.media.RingtoneManager;\nimport android.net.Uri;\nimport android.net.wifi.WifiManager;\nimport android.os.Build;\nimport android.os.IBinder;\nimport android.os.PowerManager;\n\nimport org.json.JSONArray;\nimport org.json.JSONObject;\n\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;\nimport java.net.HttpURLConnection;\nimport java.net.URL;\nimport java.nio.charset.StandardCharsets;\nimport java.util.Iterator;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.ScheduledExecutorService;\nimport java.util.concurrent.TimeUnit;\n\npublic class DashboardSyncService extends Service {\n    public static final String PREFS_NAME = \x22RojinDashPrefs\x22;\n    private static final String CHANNEL_BG_ID = \x22rojin_dash_bg_v8\x22;\n    private static final String CHANNEL_ALERT_ID = \x22rojin_dash_alert_v8\x22;\n    private static final int BG_NOTIF_ID = 301;\n\n    private static long lastNotifMs = 0L;\n    private static String lastNotifKey = \x22\x22;\n    private static int notifSeq = 4000;\n\n    private PowerManager.WakeLock wakeLock;\n    private WifiManager.WifiLock wifiLock;\n    private ScheduledExecutorService scheduler;\n    private ExecutorService sseExec;\n    private volatile boolean running = true;\n    private volatile boolean sseActive = false;\n    private volatile String activeSseToken = \x22\x22;\n\n    @Override\n    public void onCreate() {\n        super.onCreate();\n        running = true;\n        ensureChannels(this);\n        acquireLocks();\n        promoteToForeground();\n\n        sseExec = Executors.newSingleThreadExecutor();\n        scheduler = Executors.newSingleThreadScheduledExecutor();\n        scheduler.scheduleWithFixedDelay(() -> {\n            if (!running) return;\n            try {\n                ensureSseConnected();\n                pollServerState();\n            } catch (Throwable ignored) {}\n        }, 1L, 7L, TimeUnit.SECONDS);\n    }\n\n    @Override\n    public int onStartCommand(Intent intent, int flags, int startId) {\n        running = true;\n        ensureChannels(this);\n        acquireLocks();\n        promoteToForeground();\n        if (scheduler != null && !scheduler.isShutdown()) {\n            scheduler.execute(() -> {\n                try {\n                    ensureSseConnected();\n                    pollServerState();\n                } catch (Throwable ignored) {}\n            });\n        }\n        return START_STICKY;\n    }\n\n    private void acquireLocks() {\n        try {\n            if (wakeLock == null) {\n                PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);\n                if (pm != null) {\n                    wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, \x22RojinDashboard\x3a\x3aSyncLock\x22);\n                    wakeLock.setReferenceCounted(false);\n                }\n            }\n            if (wakeLock != null && !wakeLock.isHeld()) wakeLock.acquire();\n        } catch (Throwable ignored) {}\n\n        try {\n            if (wifiLock == null) {\n                WifiManager wm = (WifiManager) getApplicationContext().ge')"

      - name: Write DashboardSyncService Part 2
        run: python3 -c "import pathlib; p = pathlib.Path('app/src/main/java/ir/factoranbar/dashboard/DashboardSyncService.java'); p.parent.mkdir(parents=True, exist_ok=True); open(p, 'a', encoding='utf-8').write('tSystemService(Context.WIFI_SERVICE);\n                if (wm != null) {\n                    wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, \x22RojinDashboard\x3a\x3aWifiLock\x22);\n                    wifiLock.setReferenceCounted(false);\n                }\n            }\n            if (wifiLock != null && !wifiLock.isHeld()) wifiLock.acquire();\n        } catch (Throwable ignored) {}\n    }\n\n    private void promoteToForeground() {\n        Notification n = buildBgNotification();\n        try {\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n                startForeground(BG_NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);\n            } else {\n                startForeground(BG_NOTIF_ID, n);\n            }\n        } catch (Throwable t) {\n            try {\n                startForeground(BG_NOTIF_ID, n);\n            } catch (Throwable ignored) {}\n        }\n    }\n\n    public static void ensureChannels(Context ctx) {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);\n            if (nm == null) return;\n            NotificationChannel bg = new NotificationChannel(CHANNEL_BG_ID, \x22پایش دائمی داشبورد روژین\x22, NotificationManager.IMPORTANCE_LOW);\n            bg.setDescription(\x22حفظ ارتباط لحظه‌ای با سرور انبار و ناوگان در پس‌زمینه\x22);\n            nm.createNotificationChannel(bg);\n\n            NotificationChannel al = new NotificationChannel(CHANNEL_ALERT_ID, \x22اعلان‌های فوری داشبورد روژین\x22, NotificationManager.IMPORTANCE_HIGH);\n            al.setDescription(\x22اعلان وضعیت تحویل، پیام راننده، رسید و فاکتور جدید\x22);\n            al.enableVibration(true);\n            nm.createNotificationChannel(al);\n        }\n    }\n\n    public static synchronized void showAlertNotification(Context ctx, String rawTitle, String rawBody, String tag) {\n        if (ctx == null) return;\n        ensureChannels(ctx);\n        String title = rawTitle != null ? rawTitle.trim() \x3a \x22داشبورد روژین\x22;\n        title = title.replace(\x22📦 سیستم یکپارچه انبار و توزیع | \x22, \x22\x22)\n                     .replace(\x22🚚 پرتال راننده (سیستم انبار) | \x22, \x22\x22).trim();\n        if (title.isEmpty()) title = \x22داشبورد روژین\x22;\n        String body = rawBody != null ? rawBody.trim() \x3a \x22\x22;\n\n        long now = System.currentTimeMillis();\n        String cleanTag = (tag != null ? tag.trim() \x3a \x22\x22);\n        SharedPreferences prefs = ctx.getSharedPreferences(PREFS_NAME, MODE_PRIVATE);\n        if (!cleanTag.isEmpty()) {\n            String recentTags = prefs.getString(\x22recentNotifTags\x22, \x22\x22);\n            String tagTok = \x22|\x22 + cleanTag + \x22|\x22;\n            if (recentTags.contains(tagTok)) return;\n            String updated = recentTags + tagTok;\n            if (updated.length() > 4000) updated = updated.substring(updated.length() - 4000);\n            prefs.edit().putString(\x22recentNotifTags\x22, updated).apply();\n        }\n\n        String dedupKey = title + \x22|\x22 + body;\n        if (dedupKey.equals(lastNotifKey) && (now - lastNotifMs) < 35000L) return;\n        lastNotifMs = now;\n        lastNotifKey = dedupKey;\n\n        Intent i = new Intent(ctx, MainActivity.class);\n        i.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);\n        int pFlags = PendingIntent.FLAG_UPDATE_CURRENT;\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) pFlags |= PendingIntent.')"

      - name: Write DashboardSyncService Part 3
        run: python3 -c "import pathlib; p = pathlib.Path('app/src/main/java/ir/factoranbar/dashboard/DashboardSyncService.java'); p.parent.mkdir(parents=True, exist_ok=True); open(p, 'a', encoding='utf-8').write('FLAG_IMMUTABLE;\n        int id = ++notifSeq;\n        PendingIntent pi = PendingIntent.getActivity(ctx, id, i, pFlags);\n\n        Uri sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);\n        Notification.Builder b;\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            b = new Notification.Builder(ctx, CHANNEL_ALERT_ID);\n        } else {\n            b = new Notification.Builder(ctx);\n            b.setPriority(Notification.PRIORITY_HIGH);\n            b.setSound(sound);\n            b.setDefaults(Notification.DEFAULT_ALL);\n        }\n\n        b.setSmallIcon(R.mipmap.ic_launcher)\n                .setLargeIcon(BitmapFactory.decodeResource(ctx.getResources(), R.mipmap.ic_launcher))\n                .setContentTitle(title)\n                .setContentText(body)\n                .setStyle(new Notification.BigTextStyle().bigText(body))\n                .setAutoCancel(true)\n                .setContentIntent(pi);\n\n        NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);\n        if (nm != null) {\n            nm.notify(id, b.build());\n        }\n    }\n\n    private Notification buildBgNotification() {\n        Intent i = new Intent(this, MainActivity.class);\n        i.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);\n        int pFlags = PendingIntent.FLAG_UPDATE_CURRENT;\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) pFlags |= PendingIntent.FLAG_IMMUTABLE;\n        PendingIntent pi = PendingIntent.getActivity(this, 0, i, pFlags);\n\n        Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O\n                ? new Notification.Builder(this, CHANNEL_BG_ID)\n                \x3a new Notification.B