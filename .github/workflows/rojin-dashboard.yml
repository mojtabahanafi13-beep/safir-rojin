name: Build Rojin Dashboard V5

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Convert Project to Rojin Dashboard V5
        run: python3 -c "import pathlib; ext_cond = 'scheme.equals(\x22tel\x22) || uri.toString().contains(\x22/dashboard-receipts/\x22) || uri.toString().contains(\x22/api/invoice-cache/\x22) || uri.toString().contains(\x22/api/dashboard-receipt-file\x22) || uri.toString().contains(\x22/api/dashboard-folder\x22) || uri.toString().contains(\x22/api/file\x22) || uri.toString().contains(\x22/api/get-receipt\x22) || uri.toString().contains(\x22/api/dashboard-fleet/photo\x22) || uri.toString().contains(\x22/api/dashboard-fleet/chat/photo\x22) || uri.toString().contains(\x22/dashboard/open.html\x22) || uri.toString().contains(\x22wa.me\x22) || uri.toString().toLowerCase().endsWith(\x22.pdf\x22)'; js_hook = 'CookieManager.getInstance().flush(); view.evaluateJavascript(\x22document.addEventListener(\x27click\x27,function(e){var a=e.target&&e.target.closest&&e.target.closest(\x27a[target=_blank]\x27);if(a)a.removeAttribute(\x27target\x27);},true);\x22, null);'; [p.write_text(p.read_text('utf-8', errors='ignore').replace('ir.factoranbar.safirrojin','ir.factoranbar.dashboard').replace('/driver/index.html','/dashboard/dashboard.html').replace('سفیر روژین','داشبورد روژین').replace('Safir Rojin','Rojin Dashboard').replace('/api/driver/position','/api/dashboard-fleet/unread').replace('/api/driver/track','/api/dashboard-fleet/unread').replace('scheme.equals(\x22tel\x22)', ext_cond).replace('CookieManager.getInstance().flush();', js_hook), 'utf-8') for p in pathlib.Path('app').rglob('*') if p.is_file() and p.suffix in ('.gradle','.kts','.java','.kt','.xml','.html','.js')]"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rojin-Dashboard.apk

      - name: Upload Rojin-Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Rojin-Dashboard-APK
          path: Rojin-Dashboard.apk
