چرا داره سفیرو میسازه ؟ اون خراب نشه ی وقت

خیالتان کاملاً راحت باشد! برنامه «سفیر روژین» به هیچ وجه خراب یا دستکاری نمی‌شود.

دلیل اینکه می‌بینید Build Safir Rojin APK هم شروع به چرخیدن کرده این است که در گیت‌هاب، هر وقت هر فایل جدیدی به پروژه اضافه کنید، گیت‌هاب به صورت خودکار تمام دستورهای داخل پوشه workflows را روی سرورهای موقت و کاملاً جداگانه اجرا می‌کند؛ بنابراین برنامه سفیر کاملاً سالم و دست‌نخورده باقی می‌ماند.
چرا گزینه Build Rojin Dashboard APK در ثانیه ۹ ضربدر قرمز (❌) خورد؟

در پیام قبلی، کد داخل کادر دارای یک خطِ فشرده بسیار طولانی (۱۶ هزار حرفی) بود که وقتی روی گوشی کپی و پیست (Copy/Paste) می‌شود، کیبورد و مرورگر موبایل وسط آن را می‌بُرند و ناقص پیست می‌کنند.

برای اینکه این مشکل برای همیشه حل شود، کد دستور ساخت «داشبورد روژین» را به یک کد ۳۸ خطی ساده و بدون هیچ متن فشرده‌ای تبدیل کردم که همان پروژه و لوگوی سالمِ فعلی گیت‌هاب شما را برمی‌دارد و نسخه مجزای داشبورد روژین (پنل مدیریت) را با شناسه مستقل ir.factoranbar.dashboard می‌سازد تا کنار برنامه سفیر روی یک گوشی نصب شود:
نماد YML
dashboard-android
 YML 
۳ گام ساده برای سبز شدن (✅) ساخت داشبورد

۱. وارد پوشه .github/workflows در گیت‌هاب خود شوید و روی فایلی که ساختید (dashboard.yml) بزنید.
۲. بالای کادر کد، روی آیکون مداد (✏️ Edit) بزنید، کل متن قبلی داخل آن را پاک کنید و این کد ۳۸ خطی کوتاه را کپی کرده و جایگزین کنید:
YAML

name: Build Rojin Dashboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Convert Project to Rojin Dashboard
        run: python3 -c "import pathlib; [p.write_text(p.read_text('utf-8').replace('ir.factoranbar.safirrojin','ir.factoranbar.dashboard').replace('/driver/index.html','/dashboard/dashboard.html').replace('سفیر روژین','داشبورد روژین').replace('Safir Rojin','Rojin Dashboard').replace('/api/driver/position','/api/dashboard-fleet/unread').replace('/api/driver/track','/api/dashboard-fleet/unread'), 'utf-8') for p in pathlib.Path('app').rglob('*') if p.is_file() and p.suffix in ('.gradle','.kts','.java','.kt','.xml','.html','.js')]"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp $(find app/build/outputs/apk -name "*.apk" | head -n 1) Rojin-Dashboard.apk

      - name: Upload Rojin-Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Rojin-Dashboard-APK
          path: Rojin-Dashboard.apk

۳. دکمه سبز Commit changes را بزنید و در تب Actions صبر کنید تا کنار Build Rojin Dashboard APK تیک سبز (✅) بخورد؛ سپس روی آن بزنید و از پایین صفحه فایل Rojin-Dashboard-APK را دانلود و نصب کنید.

خطا

عکسی که فرستادید دقیقاً علت خطا را مشخص کرد!

در عکس نوشته شده:

    Prepare Clean Android Project ... 3h+ImKCf
    unexpected EOF while looking for matching '"'

این یعنی گیت‌هاب هنوز دارد همان فایل قدیمی (dashboard.yml) را اجرا می‌کند که متن فشرده‌اش وسط کار (سرِ عبارت 3h+ImKCf) بریده شده بود و کد جدید هنوز جایگزین آن نشده است (یا فایل قدیمی کنار فایل جدید در پوشه باقی مانده است).

برای اینکه روی گوشی بدون درگیر شدن با ویرایش متنِ طولانی قبلی، در ۳۰ ثانیه این مشکل را حل کنید، نام دستور جدید را Build Rojin Dashboard V2 گذاشتم تا در لیست Actions کاملاً مشخص و متمایز باشد:
