name: Build Safir Rojin APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAFIR_KS_PASS: ${{ secrets.SAFIR_KS_PASS }}
      SAFIR_KEY_ALIAS: safir

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Prepare fixed signing key
        env:
          SAFIR_KS_B64: ${{ secrets.SAFIR_KS_B64 }}
        run: |
          if [ -n "$SAFIR_KS_B64" ]; then echo "$SAFIR_KS_B64" | base64 -d > safir-release.jks; echo "fixed key ready"; else echo "no SAFIR_KS_B64 secret - using temporary debug key"; fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Safir-Rojin.apk

      - name: Upload Safir-Rojin APK
        uses: actions/upload-artifact@v4
        with:
          name: Safir-Rojin-APK
          path: Safir-Rojin.apk
          if-no-files-found: error
