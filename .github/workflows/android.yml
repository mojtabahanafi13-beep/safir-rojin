name: Build Safir Rojin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Clean Android Project
        run: python3 -c "import zlib,base64; exec(zlib.decompress(base64.b64decode('')).decode('utf-8'))"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Safir-Rojin.apk

      - name: Upload Safir-Rojin APK
        uses: actions/upload-artifact@v4
        with:
          name: Safir-Rojin-APK
          path: Safir-Rojin.apk
